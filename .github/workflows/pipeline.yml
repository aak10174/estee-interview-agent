name: interview-pipeline

# Manual only, by choice: the pipeline is run by hand from a laptop.
#
# This job is kept because it is the one way to run the pipeline with no laptop
# involved. To use it: run it from the Actions tab (Run workflow), which needs
# three repo secrets first - ANTHROPIC_API_KEY, TELEGRAM_BOT_TOKEN,
# TELEGRAM_CHAT_ID, under Settings -> Secrets and variables -> Actions.
#
# To make it nightly instead, uncomment the two schedule lines below. Do not
# uncomment them before the secrets exist, or it fails every night and emails
# the repo owner about it.
on:
  # schedule:
  #   - cron: "0 23 * * *"   # 23:00 UTC = 07:00 China Standard Time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/pipeline.py
      - name: Commit vault updates
        run: |
          git config user.name "interview-pipeline"
          git config user.email "actions@github.com"
          git add vault
          git diff --staged --quiet || git commit -m "vault: automated update $(date -u +%F)"
          git push
